[project]
name = "uknd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srijan-Petwal", email = "srijan8a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xgboost>=3.4.1",
]

[project.scripts]
uknd = "uknd:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
